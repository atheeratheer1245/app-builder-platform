workflows:
  android_release_artifacts:
    name: App Builder Android APK and AAB
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - app_builder_android_signing
      java: 21
    scripts:
      - name: Prepare this customer's native project configuration
        script: |
          cd android-companion
          rm -f app/src/main/res/raw/app_builder_export_config.json
          if [ -n "${APP_BUILDER_EXPORT_CONFIG_URL:-}" ]; then
            mkdir -p app/src/main/res/raw
            curl --fail --location --silent --show-error "$APP_BUILDER_EXPORT_CONFIG_URL" -o app/src/main/res/raw/app_builder_export_config.json
          fi
      - name: Build standalone Android artifacts
        script: |
          cd android-companion
          chmod +x ./gradlew
          test -n "${APP_BUILDER_RELEASE_KEYSTORE_B64:-}"
          mkdir -p .release
          printf '%s' "$APP_BUILDER_RELEASE_KEYSTORE_B64" | base64 --decode > .release/app-builder-release.jks
          export APP_BUILDER_RELEASE_KEYSTORE_PATH="$PWD/.release/app-builder-release.jks"
          ./gradlew --no-daemon --max-workers=2 assembleRelease bundleRelease
    artifacts:
      - android-companion/app/build/outputs/apk/release/app-release.apk
      - android-companion/app/build/outputs/bundle/release/app-release.aab
