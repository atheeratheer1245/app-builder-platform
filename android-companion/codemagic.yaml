workflows:
  android_release_artifacts:
    name: App Builder Android APK and AAB
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 21
    scripts:
      - name: Verify Gradle wrapper
        script: |
          chmod +x ./gradlew
          ./gradlew --version
      - name: Build Android artifacts
        script: |
          ./gradlew --no-daemon --max-workers=2 assembleDebug bundleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/outputs/bundle/debug/app-debug.aab
    publishing:
      email:
        recipients: []
        notify:
          success: false
          failure: false
